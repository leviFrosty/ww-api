name: Deploy to Cloudflare Workers

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute build metadata
        id: meta
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The Buddies photo bucket and its lifecycle rules, created or reset on
      # every deploy (scripts/r2-lifecycle.mjs). The API token needs Workers
      # R2 Storage: Edit.
      - name: Ensure the Buddies photo bucket
        run: node scripts/r2-lifecycle.mjs ww-buddy-blobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # --outdir keeps the bundled worker + source map on disk so the
          # Sentry upload step below can pick them up.
          command: deploy --outdir dist
          secrets: |
            HERE_API_KEY
            SENTRY_DSN
            OPENROUTER_API_KEY
            REVENUECAT_API_KEY
          vars: |
            APP_VERSION
            COMMIT_SHA
            SENTRY_RELEASE
        env:
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit }}
          # Full commit sha — matches `sentry-cli releases propose-version`,
          # which the source map upload step tags its artifacts with.
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Upload source maps to Sentry
        run: pnpm run sentry:sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
